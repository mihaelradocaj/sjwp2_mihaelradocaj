<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Igra pogodi broj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #2c3e50;
        text-align: center;
    }

    .header {
        color: #f7a8a8;
        font-family: Brush Script MT, cursive;
        font-size: 3em;
    }

    .container {
        margin: 5vh auto;
        width: 30vw;
        background-color: #99a5b0;
        padding: 2vw;
        border-radius: 20px;
        box-shadow: 0 0 1.5vw 0.5vw rgba(108, 135, 163, 0.5);
    }

    .container p {
        font-size: 1.2em;
        font-family: 'Nunito', sans-serif;
        color: white;
        font-style: italic;
    }

    input[type="number"] {
        width: 90%;
        padding: 1vw;
        margin-bottom: 1vh;
        border-radius: 5px;
        border: 1px solid white;
    }

    button {
        padding: 1vw 2vw;
        margin-top: 1vh;
        cursor: pointer;
    }

    .footer {
        margin-top: 20px;
    }
</style>

<body>
    <div class="header">
        <h1 id="naslov">Pogodi broj</h1>
    </div>
    <div class="container">
        <p id="poruka">Pogodi broj između 1 i 100</p>
        <input type="number" id="unos" placeholder="Unesite broj">
        <p id="brojPokusaja">Broj pokušaja: 0</p>
        <button id="provjeri">Provjeri</button>
        <p id="rezultat"></p>
    </div>
    <div class="footer">
        <p>Ponovi igru?</p>
        <button id="ponovi">Ponovi</button>
    </div>


</body>
</html>
