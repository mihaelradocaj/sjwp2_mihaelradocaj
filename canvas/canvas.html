<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas</title>
  </head>
  <body>
    <canvas
      id="myCanvas"
      width="600"
      height="600"
      style="border: 1px solid #000000"
    ></canvas>

    <canvas
      id="myCanvas2"
      width="800"
      height="600"
      style="border: 1px solid #000000"
    >
    </canvas>

    <script>
      let c = document.getElementById("myCanvas");
      let ctx = c.getContext("2d");

      ctx.beginPath();
      ctx.rect(10, 10, 400, 400);
      ctx.fillStyle = "red";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(200, 300, 100, 0, 2 * Math.PI);
      ctx.strokeStyle = "yellow";
      ctx.lineWidth = 10;
      ctx.stroke();

      ctx.moveTo(100, 200);
      ctx.lineTo(200, 300);
      ctx.lineTo(50, 300);
      ctx.lineTo(100, 200);
      ctx.stroke();
    </script>

    <script>
      let c2 = document.getElementById("myCanvas2");
      let ctx2 = c2.getContext("2d");

      ctx2.beginPath();
      ctx2.rect(50, 200, 500, 300);
      ctx2.fillStyle = "blue";
      ctx2.fill();

      ctx2.beginPath();
      ctx2.moveTo(50, 200);
      ctx2.lineTo(300, 50);
      ctx2.lineTo(550, 200);
      ctx2.fillStyle = "brown";
      ctx2.fill();

      ctx2.beginPath();
      ctx2.rect(100, 350, 100, 150);
      ctx2.fillStyle = "lightgrey";
      ctx2.fill();

      ctx.beginPath();
      ctx2.rect(300, 350, 150, 100);
      ctx2.fillStyle = "lightgrey";
      ctx2.fill();

      ctx2.beginPath();
      ctx2.arc(650, 200, 50, 0, 2 * Math.PI);
      ctx2.fillStyle = "green";
      ctx2.fill();

      ctx2.beginPath();
      ctx2.rect(640, 250, 20, 250);
      ctx2.fillStyle = "brown";
      ctx2.fill();
    </script>
  </body>
</html>
